plugins {
	id "java"
	id "org.sglahn.gradle-dockerfile-plugin" version "0.5"
}

repositories {
	mavenCentral()
}

version = "0.0.2"
sourceCompatibility = 1.8

dependencies {
	compile "org.slf4j:slf4j-api:1.7.13"
	compile "ch.qos.logback:logback-classic:1.2.13"
	compile "io.netty:netty-all:4.1.42.Final"
	compile "com.alibaba:fastjson:1.2.83"
	compile "org.apache.commons:commons-lang3:3.18.0"
	compile "org.apache.commons:commons-collections4:4.1"
	compile "commons-io:commons-io:2.14.0"
	compile "commons-codec:commons-codec:1.11"
	compile "com.google.guava:guava:32.0.0-jre"
	compile "com.beust:jcommander:1.72"
	compile "com.typesafe:config:1.3.1"
	compile "org.freemarker:freemarker:2.3.35"
	compileOnly "org.projectlombok:lombok:1.18.2"
	testCompile "junit:junit:4.13.1"
}

jar {
	manifest {
		attributes "Main-Class": "io.github.yangziwen.zyftp.run.FtpRunner"
	}
	from {
		configurations.compile.collect { it.isDirectory() ? it : zipTree(it) }
	}
}

task copyJar(type: Copy, dependsOn: build) {
	from "$buildDir/libs/zy-ftp-${version}.jar"
	into "$projectDir/target"
	rename("zy-ftp-${version}.jar", "zy-ftp.jar")
}

docker {
	tags = [version]
}

build.finalizedBy copyJar
dockerBuild.dependsOn copyJar
